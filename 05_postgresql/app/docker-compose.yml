
services:
  postgres:
    image: postgres:17
    container_name: fastapi_postgres

    restart: always

    environment:
      POSTGRES_USER: postres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fastapi_db # database name

    
    ports:
      - "5488:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:8.10
    container_name: fastapi_redis

    restart: always

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  postgres_data: # volume name
  redis_data: